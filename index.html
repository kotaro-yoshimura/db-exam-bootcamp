    <title>DBスペシャリスト学習ノート — 令和8年度後期・CBT対策</title>
    <script>
      // iPad/iPhone Safari の data: URL（ショートカット起動）では MessageChannel が opaque origin 制限を受けるため
      // React スケジューラを安全な setTimeout フォールバックへ自動誘導する
      try {
        if (typeof location !== 'undefined' && location.protocol === 'data:') {
          window.MessageChannel = undefined;
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F2F2F7] text-[#1D1D1F] antialiased selection:bg-[#007AFF]/15 selection:text-[#1D1D1F]">
    <div id="root">
      <div style="padding:40px 20px;text-align:center;color:#6E6E73;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Hiragino Sans',sans-serif;">
        <div style="font-size:15px;font-weight:700;color:#1D1D1F;margin-bottom:8px;">
          DBスペシャリスト学習ノートを読み込んでいます...
        </div>
        <div id="boot-hint" style="font-size:12px;line-height:1.7;max-width:460px;margin:0 auto;">
          画面が切り替わらない場合、iPadの「ファイル」アプリの簡易プレビュー（QuickLook）でJavaScriptが無効になっています。ショートカット（Safari）またはローカルHTML対応ブラウザから開いてください。
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
